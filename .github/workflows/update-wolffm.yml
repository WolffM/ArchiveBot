name: Auto-update @wolffm packages

# NO `schedule:` TRIGGER HERE — deliberate, do not add one back.
#
# The daily safety net lives in hadoku_site's cron-worker, where a Temporal
# schedule fires ON TIME: `services/cron-worker/profiles.json` -> repo-sync
# profile (13:00 UTC / 06:00 Pacific, the last daily profile) -> tail job
# `ci:wolffm-fanout` -> `services/mgmt-api/src/routes/jobs/wolffm-fanout.ts`,
# which dispatches `wolffm_published` to every consumer in the fleet roster.
# That job throws on a non-204, so a dropped dispatch pages Discord — louder
# than a GitHub Actions `schedule` ever is, since a failed CI fan-out only
# emits a warning and leaves its run green.
#
# A GitHub Actions `schedule` is also the wrong trigger on its own merits: it
# fires late and unpredictably (measured elsewhere in the fleet at median
# +57min, worst +162min past the nominal slot).
#
# ArchiveBot carried NO update-wolffm workflow at all until 2026-09-09 — it is
# in the fleet's wolffmConsumer roster (depends on @wolffm/logger) and every
# `wolffm_published` dispatch sent to it was silently accepted (GitHub 204s a
# repository_dispatch even with nothing listening) and did nothing. Found
# while auditing the fleet for the same gap elsewhere; this file closes it.
#
# Fast path is unchanged: a publish still dispatches `wolffm_published`
# immediately via hadoku_site's update-packages.yml fan-out.
on:
  repository_dispatch:
    types: [wolffm_published]
  workflow_dispatch:

concurrency:
  group: update-wolffm
  cancel-in-progress: true

permissions:
  contents: write   # GITHUB_TOKEN pushes bot/update-wolffm; it cannot push protected main
  packages: read

jobs:
  update:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    timeout-minutes: 10
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      # The DEFAULT token, deliberately: the bump is pushed to bot/update-wolffm
      # and mgmt-api fast-forwards main onto it (hadoku-actions/update-wolffm), so
      # this repo holds no credential that can push main or reach another repo.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: WolffM/hadoku-actions/update-wolffm@v1
        with:
          service-key: ${{ secrets.KEY_SERVICE_ARCHIVEBOT }}
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}
          recursive: 'false'

      # A red run is seen by nobody unless it says so itself: nothing polls
      # these repos. `always()` so RECOVERIES report too -- without the success
      # side the alert state stays broken and the next real failure arrives as a
      # suppressed reminder rather than a new alert.
      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: ArchiveBot:update-wolffm
          service-key: ${{ secrets.KEY_SERVICE_ARCHIVEBOT }}
          started-at: ${{ env.JOB_STARTED_AT }}
