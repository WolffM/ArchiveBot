name: Deploy to PM2

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Trigger hadoku_site to redeploy
        env:
          HADOKU_SITE_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          echo "Requesting hadoku_site to redeploy archive-bot..."
          echo "Commit: ${{ github.sha }}"

          if [ -z "$HADOKU_SITE_TOKEN" ]; then
            echo "❌ Error: HADOKU_SITE_TOKEN not available"
            exit 1
          fi

          payload=$(cat <<EOF
          {
            "event_type": "redeploy_service",
            "client_payload": {
              "service": "archive-bot",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}"
            }
          }
          EOF
          )

          status_code=$(curl -sS \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST "https://api.github.com/repos/WolffM/hadoku_site/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HADOKU_SITE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload")

          if [ "$status_code" = "204" ]; then
            echo "✅ Notified hadoku_site to redeploy archive-bot"
          else
            echo "❌ Failed to notify hadoku_site (HTTP $status_code)"
            exit 1
          fi

      # A red run is seen by nobody unless it says so itself: nothing polls
      # these repos. `always()` so RECOVERIES report too -- without the success
      # side the alert state stays broken and the next real failure arrives as a
      # suppressed reminder rather than a new alert.
      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: ArchiveBot:deploy
          service-key: ${{ secrets.KEY_SERVICE_ARCHIVEBOT }}
          started-at: ${{ env.JOB_STARTED_AT }}
